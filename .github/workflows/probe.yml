name: Probe (one-off checks)

on:
  push:
    branches: ["claude/**"]
    paths: ["tools/probe_in.json", "tools/probe.py", "phd_sources.json", "scan.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - run: python tools/probe.py
      - name: PhD scan (test of the phd profile)
        run: SCAN_PROFILE=phd python scan.py
      - name: Save results
        run: |
          git config user.name "job-scanner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/probe_out.json out/phd_*.json; git add tools/raw 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "probe results"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep 5
          done
          exit 1

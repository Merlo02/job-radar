name: Job scanner

on:
  schedule:
    - cron: "17 3 * * *"   # every night, ~05:17 Italian time (04:17 in winter)
    - cron: "52 3 * * *"   # second try in case GitHub skips the first one
  workflow_dispatch:        # "Run workflow" button
  push:
    branches: [main]
    paths: ["scan.py", "sources.json", "phd_sources.json", ".github/workflows/scan.yml"]

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # start from the latest results, not from the commit that triggered the run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scan.py
      - name: PhD positions (phd_sources.json -> out/phd_*.json)
        run: SCAN_PROFILE=phd python scan.py || echo "PhD scan failed, job results are still saved"
      - name: Save results
        run: |
          git config user.name "job-scanner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "scan $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
